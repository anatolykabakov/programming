syntax = "proto3";

package ai.flow.android;

// IMU sensor data message
message IMUData {
    int64 timestamp = 1;
    
    // Accelerometer data (m/s²)
    float accel_x = 2;
    float accel_y = 3;
    float accel_z = 4;
    
    // Gyroscope data (rad/s)
    float gyro_x = 5;
    float gyro_y = 6;
    float gyro_z = 7;
    
    // Magnetometer data (μT)
    float mag_x = 8;
    float mag_y = 9;
    float mag_z = 10;
    
    // Sensor accuracy
    int32 accuracy = 11;
    
    // Temperature (if available)
    float temperature = 12;
    
    // Sample count (for batch processing)
    int32 sample_count = 13;
}

// Accelerometer sensor data message
message AccelerometerData {
    int64 timestamp = 1;
    
    // Accelerometer data (m/s²)
    float x = 2;
    float y = 3;
    float z = 4;
    
    // Sensor accuracy
    int32 accuracy = 5;
    
    // Temperature (if available)
    float temperature = 6;
    
    // Sample count
    int32 sample_count = 7;
    
    // Calibration status
    bool is_calibrated = 8;
    
    // Bias values (if calibrated)
    float bias_x = 9;
    float bias_y = 10;
    float bias_z = 11;
}

// Gyroscope sensor data message
message GyroscopeData {
    int64 timestamp = 1;
    
    // Gyroscope data (rad/s)
    float x = 2;
    float y = 3;
    float z = 4;
    
    // Sensor accuracy
    int32 accuracy = 5;
    
    // Temperature (if available)
    float temperature = 6;
    
    // Sample count
    int32 sample_count = 7;
    
    // Calibration status
    bool is_calibrated = 8;
    
    // Bias values (if calibrated)
    float bias_x = 9;
    float bias_y = 10;
    float bias_z = 11;
}

// Magnetometer sensor data message
message MagnetometerData {
    int64 timestamp = 1;
    
    // Magnetometer data (μT)
    float x = 2;
    float y = 3;
    float z = 4;
    
    // Sensor accuracy
    int32 accuracy = 5;
    
    // Temperature (if available)
    float temperature = 6;
    
    // Sample count
    int32 sample_count = 7;
    
    // Calibration status
    bool is_calibrated = 8;
    
    // Bias values (if calibrated)
    float bias_x = 9;
    float bias_y = 10;
    float bias_z = 11;
    
    // Magnetic field strength
    float field_strength = 12;
}






