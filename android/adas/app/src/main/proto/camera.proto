syntax = "proto3";

package ai.flow.android;

// Camera image message
message CameraImage {
    // Image metadata
    int64 timestamp = 1;
    int32 width = 2;
    int32 height = 3;
    string format = 4;  // e.g., "YUV420", "RGB", "JPEG"
    int32 frame_id = 5;
    
    // Image data
    bytes image_data = 6;
    
    // Camera parameters
    float focal_length_x = 7;
    float focal_length_y = 8;
    float principal_point_x = 9;
    float principal_point_y = 10;
    
    // Camera type
    enum CameraType {
        UNKNOWN = 0;
        WIDE_ROAD = 1;
        NARROW_ROAD = 2;
        DRIVER = 3;
    }
    CameraType camera_type = 11;
}

// Camera state message
message CameraState {
    int64 timestamp = 1;
    int32 frame_id = 2;
    
    // Camera status
    bool is_recording = 3;
    bool is_connected = 4;
    
    // Camera settings
    int32 exposure_time = 5;
    int32 iso = 6;
    float white_balance = 7;
    
    // Image dimensions
    int32 width = 8;
    int32 height = 9;
    string format = 10;
}





