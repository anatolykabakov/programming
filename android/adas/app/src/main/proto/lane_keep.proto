syntax = "proto3";

package ai.flow.adas;

option java_outer_classname = "LaneKeepOuter";

// Pure Pursuit / lane-keep algorithm output for bag + PlotJuggler.
message LaneKeepState {
  // Publish time (BOOTTIME ms). Also used as ZMQMessage.timestamp.
  int64 timestamp = 1;
  double steer_rad = 2;
  double steer_norm = 3;
  double throttle = 4;
  double brake = 5;
  double lookahead_m = 6;
  double target_x = 7;
  double target_y = 8;
  bool has_target = 9;
  double curvature = 10;
  string status = 11;
  // Provenance for latency (BOOTTIME ms).
  int64 vision_ts_ms = 12;   // ONNX done / path ready (infer)
  int64 chassis_ts_ms = 13;  // vehicle chassis sample used for torque
  int64 publish_ts_ms = 14;  // same as timestamp; explicit for analysis
  int64 capture_ts_ms = 15;  // camera frame arrival — e2e pipeline start
}
