plugins {
    id 'com.android.application'
    id 'com.google.protobuf'
}

android {
    namespace 'ai.flow.adas'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "ai.flow.adas"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    // Prebuilt .so via jniLibs; NDK path from local.properties / ANDROID_NDK_ROOT
    // ndkVersion omitted on purpose — avoid AGP downloading a mismatched NDK

//    externalNativeBuild {
//        cmake {
//            path "src/main/cpp/CMakeLists.txt"
//            version "3.22.1"
//            arguments "-DCMAKE_TOOLCHAIN_FILE=${projectDir}/src/main/cpp/cmake/android-vcpkg.cmake"
//        }
//    }
//
    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libprotobuf.so'
        pickFirst '**/libprotobuf-lite.so'
        pickFirst '**/libprotoc.so'
        pickFirst '**/libzmq.so'
    }

    // Keep ONNX uncompressed so assets copy / ORT can read efficiently
    androidResources {
        noCompress 'onnx'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // Protocol Buffers
    implementation 'com.google.protobuf:protobuf-java:3.24.4'
    implementation 'com.google.protobuf:protobuf-java-util:3.24.4'

    // ZeroMQ
    implementation 'org.zeromq:jeromq:0.6.0'

    // Logging
    implementation 'org.slf4j:slf4j-api:1.7.30'
    implementation 'org.slf4j:slf4j-simple:1.7.30'

    // Supercombo ONNX (see vision/SupercomboOnnxRunner)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

// Protocol Buffers configuration
protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.24.4'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}
