plugins {
    id 'com.android.application'
    id 'com.google.protobuf'
}

android {
    namespace 'ai.flow.android'
    compileSdk 34

    defaultConfig {
        applicationId "ai.flow.android"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    
    ndkVersion "25.1.8937393"
    
//    externalNativeBuild {
//        cmake {
//            path "src/main/cpp/CMakeLists.txt"
//            version "3.22.1"
//            arguments "-DCMAKE_TOOLCHAIN_FILE=${projectDir}/src/main/cpp/cmake/android-vcpkg.cmake"
//        }
//    }
//
    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
        pickFirst '**/services.yaml'
        pickFirst '**/libprotobuf.so'
        pickFirst '**/libprotobuf-lite.so'
        pickFirst '**/libprotoc.so'
        pickFirst '**/libzmq.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    
    // OpenPilot AAR
    implementation files('libs/openpilot-0.1-arm64-v8a-debug.aar')
    
    // Cereal modules - using JAR files instead of projects
    implementation files('libs/definitions.jar')
    implementation files('libs/messaging-0.0.1.jar')
    
    // Cap'n Proto
    implementation 'org.capnproto:runtime:0.1.13'
    
    // Protocol Buffers
    implementation 'com.google.protobuf:protobuf-java:3.24.4'
    implementation 'com.google.protobuf:protobuf-java-util:3.24.4'
    
    // ZeroMQ
    implementation 'org.zeromq:jeromq:0.6.0'
    
    // YAML support
    implementation 'org.yaml:snakeyaml:1.18:android'
    
    // Logging
    implementation 'org.slf4j:slf4j-api:1.7.30'
    implementation 'org.slf4j:slf4j-simple:1.7.30'
    
    // ZMQ for C++
    implementation 'org.zeromq:jeromq:0.6.0'
    
    // Video processing (using Android MediaRecorder instead of JavaCV)
    
    // Native libraries are in src/main/jniLibs/arm64-v8a/
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

// Protocol Buffers configuration
protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.24.4'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}
